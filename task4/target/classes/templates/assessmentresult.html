<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Student Skill Gap Analysis Result</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f6f9; color: #333; }
        .card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); max-width: 600px; margin: auto; }
        h1 { color: #2c3e50; border-bottom: 2px solid #3498db; padding-bottom: 10px; }
        .result-item { font-size: 18px; margin: 15px 0; }
        .label { font-weight: bold; color: #2980b9; }
        .badge { background-color: #2ecc71; color: white; padding: 5px 10px; border-radius: 4px; font-weight: bold; }
        ul { padding-left: 20px; }
        li { margin: 5px 0; }
    </style>
</head>
<body>

    <div class="card">
        <h1>🎓 Skill Gap Analysis Result</h1>
        
        <!-- கன்ட்ரோலரில் இருந்து வரும் ரிசல்ட்டுகளை தம்பியைப் போல ஸ்கிரீனில் காட்டுகிறது ப்ரோ -->
        <div class="result-item">
            <span class="label">Matched Percentage (தகுதி சதவீதம்):</span>
            <span class="badge" th:text="${result.score + '%'}">83.33%</span>
        </div>
        
        <div class="result-item">
            <span class="label">Status (தகுதி நிலை):</span>
            <span th:text="${result.label}">Strong Match</span>
        </div>
        
        <div class="result-item">
            <span class="label">✅ Matched Skills (உங்களிடம் உள்ளவை):</span>
            <ul>
                <li th:each="skill : ${result.matched}" th:text="${skill}">Java</li>
            </ul>
        </div>
        
        <div class="result-item">
            <span class="label">❌ Missing Skills (விடுபட்ட திறமைகள்):</span>
            <ul>
                <li th:each="skill : ${result.missing}" th:text="${skill}">Git</li>
            </ul>
        </div>
        
        <div class="result-item">
            <span class="label">💡 Recommendations </span>
            <ul>
                <li th:each="rec : ${result.recommendations}" th:text="${rec}">Build one project using Git.</li>
            </ul>
        </div>
    </div>

</body>
</html>
